name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bundled viewer JavaScript
        run: node --check apps/ios/CaptureSplat/CaptureSplat/Resources/SplatViewer/main.js

      - name: Validate preview history sampling
        run: |
          xcrun swiftc \
            apps/ios/CaptureSplat/CaptureSplat/Sources/CaptureModels.swift \
            tests/swift/PreviewReservoirProbe.swift \
            -o "$RUNNER_TEMP/preview-reservoir-probe"
          "$RUNNER_TEMP/preview-reservoir-probe"

      - name: Validate native Gaussian imports
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('apps/ios/CaptureSplat/CaptureSplat/Sources/SplatViewer.swift').read_text()
          start = source.index('enum SplatLibrary {')
          end = source.index('\nstruct SplatFilePicker:', start)
          Path(os.environ['RUNNER_TEMP'], 'SplatLibrary.swift').write_text('import Foundation\n' + source[start:end])
          PY
          xcrun swiftc "$RUNNER_TEMP/SplatLibrary.swift" tests/swift/SplatImportProbe.swift -o "$RUNNER_TEMP/splat-import-probe"
          "$RUNNER_TEMP/splat-import-probe"

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/CaptureSplat/CaptureSplat.xcodeproj \
            -scheme CaptureSplat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CaptureSplat.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/SplatViewer/index.html"
          test -f "$APP_PATH/SplatViewer/main.js"
          test -f "$APP_PATH/SplatViewer/LICENSE"
          test -f "$APP_PATH/SplatViewer/THREE-LICENSE"
          /usr/libexec/PlistBuddy -c "Add :CaptureSplatBuildCommit string $GITHUB_SHA" "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "0.1.6"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "7"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload CaptureSplat-unsigned.ipa
          shasum -a 256 CaptureSplat-unsigned.ipa > CaptureSplat-unsigned.ipa.sha256
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CaptureSplat-unsigned-IPA
          path: |
            ${{ runner.temp }}/package/CaptureSplat-unsigned.ipa
            ${{ runner.temp }}/package/CaptureSplat-unsigned.ipa.sha256
            ${{ runner.temp }}/package/source-commit.txt
          if-no-files-found: error
